server:
  # Railway sets PORT automatically; default to 2333 if not set
  port: ${PORT:2333}

lavalink:
  server:
    # Set a strong password via env var LAVALINK_PASSWORD
    password: ${LAVALINK_PASSWORD:your_password_here}
    # Bind on all interfaces so external connections can reach it
    bindAddress: 0.0.0.0
    bufferDurationMs: 400
  metrics:
    prometheus: false

spring:
  main:
    banner-mode: "off"
logging:
  level:
    root: INFO
